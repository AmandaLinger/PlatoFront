<div class="overlay" (click)="closed.emit()">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="employee-form-title" (click)="$event.stopPropagation()">
    <button class="close-button" type="button" aria-label="Fechar" (click)="closed.emit()">×</button>
    <p class="eyebrow">Equipe</p>
    <h2 id="employee-form-title">Adicionar funcionário</h2>
    <form [formGroup]="form" (ngSubmit)="save()">
      <label for="employee-name">Nome</label>
      <input id="employee-name" formControlName="nome" placeholder="Nome completo">
      @if (form.controls.nome.touched && form.controls.nome.invalid) { <small>Informe o nome.</small> }
      <label for="employee-phone">Telefone</label>
      <input id="employee-phone" formControlName="telefone" placeholder="(00) 00000-0000">
      @if (form.controls.telefone.touched && form.controls.telefone.invalid) { <small>Informe o telefone.</small> }
      <label for="employee-role">Cargo / Função</label>
      <input id="employee-role" formControlName="cargo" placeholder="Ex.: Garçom">
      @if (form.controls.cargo.touched && form.controls.cargo.invalid) { <small>Informe o cargo.</small> }
      <div class="actions">
        <button class="secondary-button" type="button" (click)="closed.emit()">Cancelar</button>
        <button class="primary-button" type="submit" [disabled]="form.invalid">Salvar</button>
      </div>
    </form>
  </section>
</div>

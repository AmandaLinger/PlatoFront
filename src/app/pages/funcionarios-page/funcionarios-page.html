<main class="settings-page">
  <section class="settings-container" aria-labelledby="employees-title">
    <app-btn-back />
    <header class="settings-header">
      <div><h1 id="employees-title">Funcionários</h1><p>Gerencie a equipe da loja.</p></div>
      <button class="action-button" type="button" (click)="isModalOpen = true">Adicionar funcionário</button>
    </header>
    <div class="table-wrapper">
      <table><thead><tr><th>Nome / Telefone</th><th>Cargo / Função</th></tr></thead><tbody>
        @for (funcionario of funcionarios; track funcionario.id) {
          <tr><td>{{ funcionario.nome }}<small>{{ funcionario.telefone }}</small></td><td>{{ funcionario.cargo }}</td></tr>
        }
      </tbody></table>
    </div>
  </section>
</main>
@if (isModalOpen) { <app-modal-funcionario-form (closed)="isModalOpen = false" (saved)="addFuncionario($event)" /> }
